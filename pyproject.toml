[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deviation-risk-assessment-generator"
version = "0.1.0"
description = "Simple GAMP5/URS-aligned deviation and risk assessment generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.0",
  "mysql-replication>=0.49"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
deviation-risk-generator = "deviation_risk_generator.cli:main"
bms-cdc-listener = "deviation_risk_generator.cdc:main"
bms-local-alarm = "deviation_risk_generator.cdc:local_main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
